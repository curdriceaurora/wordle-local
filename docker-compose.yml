services:
  wordle:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      ADMIN_KEY: ${ADMIN_KEY:-}
      REQUIRE_ADMIN_KEY: ${REQUIRE_ADMIN_KEY:-true}
      DEFINITIONS_MODE: ${DEFINITIONS_MODE:-memory}
      DEFINITION_CACHE_SIZE: ${DEFINITION_CACHE_SIZE:-512}
      DEFINITION_CACHE_TTL_MS: ${DEFINITION_CACHE_TTL_MS:-1800000}
      DEFINITION_SHARD_CACHE_SIZE: ${DEFINITION_SHARD_CACHE_SIZE:-6}
      PERF_LOGGING: ${PERF_LOGGING:-false}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # B7 / #126: readiness probe. /readyz returns 200 when the
    # process is up AND not shutting down AND no restore/backup is
    # holding the data lock. During graceful shutdown drain (B1) or
    # while a restore is mid-apply, this returns 503 so the
    # supervisor stops sending new traffic. For liveness (restart on
    # genuine hang), use /healthz instead.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
