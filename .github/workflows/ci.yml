name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

# Explicit minimum-required permissions so this workflow's
# `GITHUB_TOKEN` only carries the scopes the steps actually need
# — regardless of the repo/org-level default. Stays correct if a
# future admin change widens the org-default token permissions.
#
# `pull-requests: read` is required by `dorny/paths-filter@v3`,
# which uses the GitHub REST API to list changed files on
# pull_request events. Without it the filter silently returns
# no matches (no error — just an empty result), which would
# make the conditional steps (provider-workflow gate) skip
# even on genuinely-changed PRs. CodeRabbit caught this on
# PR #138.
permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Detect Provider Workflow Changes
        if: github.event_name == 'pull_request'
        id: provider_paths
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            provider_workflow:
              - 'server.js'
              - 'lib/admin-auth.js'
              - 'lib/provider-*.js'
              - 'lib/language-registry.js'
              - 'public/admin/**'
              - 'playwright.config.js'
              - 'tests/ui/admin-shell.spec.js'
              - 'tests/ui/fixtures.js'
              - 'tests/server.test.js'
              - 'data/providers/**'
              - 'data/languages.json'
              - 'data/languages.schema.json'
            renovate_config:
              - '.github/renovate.json'

      - name: Run Local Quality Gates
        run: npm run check

      - name: Validate Renovate Config
        if: github.event_name == 'pull_request' && steps.provider_paths.outputs.renovate_config == 'true'
        run: npm run renovate:check

      - name: Install Playwright Chromium (provider gate)
        if: github.event_name == 'pull_request' && steps.provider_paths.outputs.provider_workflow == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Provider Workflow UI Regression Gate
        if: github.event_name == 'pull_request' && steps.provider_paths.outputs.provider_workflow == 'true'
        run: npm run test:provider:ui

      - name: Install Playwright Browsers
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # Install all 3 browsers — DEFAULT_BROWSERS in playwright.config.js
        # is chromium + firefox + webkit. Webkit was re-enabled by the PR
        # that closed #142 (fixing the upstream root cause: CSP
        # `upgrade-insecure-requests` forcing HTTPS upgrade on localhost;
        # webkit doesn't auto-exempt loopback like chromium/firefox do).
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run UI Tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:ui

      - name: Upload UI Coverage Report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-coverage
          path: |
            coverage/ui/report
            coverage/ui/coverage-summary.json

  docker-build:
    # Builds the production Dockerfile and smoke-tests the container.
    # `npm run check` in the `test` job above never runs `npm run build`
    # or `npm ci --omit=dev` — the asset-bundling and production-install
    # paths the Dockerfile actually exercises — so a base-image digest
    # bump or an esbuild update could otherwise auto-merge unvalidated.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build Docker image
        run: docker build -t wordle-local:ci .

      - name: Smoke-test container
        run: |
          docker run -d --name wordle-ci -p 3000:3000 wordle-local:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              echo "Container is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy in time" >&2
          exit 1

      - name: Container logs (on failure)
        if: failure()
        run: docker logs wordle-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f wordle-ci || true
