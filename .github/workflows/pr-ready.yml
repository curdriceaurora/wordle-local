name: PR Readiness Gate

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - review_requested
      - review_request_removed
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  workflow_run:
    workflows:
      - CI
      - CodeQL
      - Copilot Review Trigger
      - PR Watch Status
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to evaluate"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read

jobs:
  pr-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve PR Number
        id: pr
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail

          pr=""
          case "$EVENT_NAME" in
            pull_request|pull_request_review)
              pr="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")"
              ;;
            workflow_run)
              pr="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
              ;;
            workflow_dispatch)
              pr="$DISPATCH_PR"
              ;;
          esac

          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No pull request context detected for event '$EVENT_NAME'."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$pr"

      - name: Checkout
        if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        if: steps.pr.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Evaluate PR Readiness Gates
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/pr-ready-watch.js \
            --pr "${{ steps.pr.outputs.pr }}" \
            --timeout 85 \
            --interval 20 \
            --ignore-checks pr-ready
